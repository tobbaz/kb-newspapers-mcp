[project]
name = "kb-tidningar-mcp"
version = "0.1.0"
description = "MCP server for searching digitized historical Swedish newspapers via Kungliga biblioteket (KB) APIs"
readme = "README.md"
authors = [
    { name = "Tobbe", email = "tobbe75@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
]

[project.scripts]
kb-tidningar-mcp = "kb_tidningar_mcp:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
